default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: lint-and-format
        name: Ruff lint and format checks
        entry: make lint format-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: fullcheck
        name: Ruff and Pyright checks
        entry: make fullcheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
