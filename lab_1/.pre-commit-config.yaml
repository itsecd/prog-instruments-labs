repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.16.7
  hooks:
    # Run the linter.
    - id: ruff-check
    # Run the formatter.
    - id: ruff-format
      args: [ --check ]

- repo: https://github.com/RobertCraigie/pyright-python
  rev: v1.1.414
  hooks:
    - id: pyright
      stages: [pre-push]