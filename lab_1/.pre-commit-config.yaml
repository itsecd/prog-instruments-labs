repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: python -c "import subprocess, sys; sys.exit(0 if subprocess.call(['pytest']) in (0, 5) else 1)"
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]