default_install_hook_types: [pre-commit, pre-push]
files: ^lab_1/
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --config lab_1/pyproject.toml
        language: python
        additional_dependencies: [ruff==0.17.6]
        types: [python]
        stages: [pre-commit, pre-push]
      - id: ruff-format
        name: Ruff format check
        entry: python -m ruff format --check --config lab_1/pyproject.toml
        language: python
        additional_dependencies: [ruff==0.17.6]
        types: [python]
        stages: [pre-commit, pre-push]
      - id: pyright
        name: Pyright type check
        entry: python -m pyright --project lab_1/pyproject.toml
        language: python
        additional_dependencies: [pyright==1.1.414, numpy==2.5.5]
        pass_filenames: false
        stages: [pre-push]
