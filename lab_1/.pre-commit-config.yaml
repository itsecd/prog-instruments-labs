minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: make -C lab_1 lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: ruff-format
        name: Ruff format check
        entry: make -C lab_1 format-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: pyright
        name: Pyright strict
        entry: make -C lab_1 typecheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest
        name: Pytest
        entry: make -C lab_1 test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
