default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--config, lab_1/pyproject.toml, --fix]
        files: ^lab_1/.*\.py$
        stages: [pre-commit]
      - id: ruff-format
        args: [--config, lab_1/pyproject.toml, --check]
        files: ^lab_1/.*\.py$
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pyright
        name: pyright typecheck
        entry: python -m pyright --project lab_1/pyproject.toml
        language: system
        files: ^lab_1/.*\.py$
        pass_filenames: false
        stages: [pre-push]