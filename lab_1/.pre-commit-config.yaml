repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: make -C lab_1 lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format check
        entry: make -C lab_1 format-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: pyright
        name: pyright
        entry: make -C lab_1 typecheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: unittest
        name: unit tests
        entry: make -C lab_1 test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]