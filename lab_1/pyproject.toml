[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
preview = false
exclude = [".venv", "venv"]
force-exclude = true
fix = true
unsafe-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL"]
ignore = ["E501", "D", "T201", "CPY001", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "INP001", "PLR2004", "E402"]

[tool.pyright]
include = ["bad_code.py"]
exclude = ["build", "generated", ".venv", "venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["bad_code.py"]
reportMissingTypeStubs = "error"