[tool.ruff]
src = ["src"]
line-length = 79
target-version = "py314"
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.14"
extraPaths = ["src"]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "venv",
    "build",
    "dist",
]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]