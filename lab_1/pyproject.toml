[tool.ruff]
src = ["lab_1"]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["lab_1"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"