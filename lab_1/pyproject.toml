[project]
name = "lab-1-hash-tool"
version = "0.1.0"
description = "Hash tool (lab_1) for the programming technologies course"
requires-python = ">=3.11"

dependencies = [
    "PyQt6>=6.11.0",
]

# Ruff

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".ruff_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific
    "PL",  # pylint
]

ignore = [
    "PLR0913",   # too many arguments in function definition
    "PLR2004",   # magic value used in comparison
    "RUF001",    # ambiguous unicode character in strings
    "RUF002",    # ambiguous unicode character in docstrings
    "RUF003",    # ambiguous unicode character in comments
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# Pyright — статическая проверка типов
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["."]
exclude = [
    ".venv",
    "__pycache__",
    ".ruff_cache",
    ".pytest_cache",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"