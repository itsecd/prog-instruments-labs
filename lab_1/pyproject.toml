[project]
name = "calc-project"
version = "0.1.0"
description = "Простой калькулятор для лабораторной работы"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["lab_1"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
    "D",   # pydocstyle
]
ignore = [
    "D203", # конфликтует с D211
    "D213", # конфликтует с D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]