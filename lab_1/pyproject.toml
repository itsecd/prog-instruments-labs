[tool.ruff]

exclude = [
    ".git", ".ruff_cache", ".venv", "venv", "__pycache__",
]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "B",
    "C4",
    "UP",
]

ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["values", "task1"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
