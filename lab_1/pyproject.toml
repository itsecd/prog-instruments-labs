[tool.ruff]
line-length = 120
target-version = "py311"
src = ["."]
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E", 
    "W",
    "F", 
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "D", 
    "S",  
    "PL", 
    "RUF"
]
ignore = [
    "D203", 
    "D212", 
    "D213", 
    "D1"                    
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004"]
"src/main.py" = ["PLR0912", "PLR0915"]   

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["."]