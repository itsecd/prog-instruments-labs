name: Setup PR for code review

on:
  pull_request_target:
    types: [opened, reopened]

permissions: write-all

jobs:

  assign:
    runs-on: ubuntu-latest

    steps:
      - name: Parsing your PR title for lab number
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          SUB='Лаб.'
          for VAR in 1 2 3 4 5 6 7 8 9
          do
              if (echo "$TITLE" | grep -iqF "$SUB$VAR") || (echo "$TITLE" | grep -iqF "$SUB $VAR"); then
                  echo "LABEL=Lab $VAR" >> "$GITHUB_ENV"
                  break
              fi
          done

          for VAR in 6311 6312 6313
          do
              if echo "$TITLE" | grep -iqF "$VAR"; then
                  echo "GROUP=$VAR" >> "$GITHUB_ENV"
                  break
              fi
          done

      - name: Checking your lab number
        run: |
          if [[ $LABEL == '' ]]; then
              echo "Your PR caption is not composed correctly"
              exit 1
          fi
          echo "Your number was parsed correctly - $LABEL"

      - name: Checking your group number
        run: |
          if [[ $GROUP == '' ]]; then
              echo "Your PR caption is not composed correctly"
              exit 1
          fi
          echo "Your group was parsed correctly - $GROUP"

      - name: Setting PR labels
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: |
            ${{ env.LABEL }}
            In progress

      # Группа 6311
      - name: Setting reviewer for 6311
        if: env.GROUP == '6311'
        uses: AveryCameronUofR/add-reviewer-gh-action@1.0.3
        with:
          reviewers: "IlyaOv"
          token: ${{ secrets.GITHUB_TOKEN }}

      # Группа 6312
      - name: Setting reviewer for 6312
        if: env.GROUP == '6312'
        uses: AveryCameronUofR/add-reviewer-gh-action@1.0.3
        with:
          reviewers: "mxwrlld"
          token: ${{ secrets.GITHUB_TOKEN }}

      # Группа 6313 + нечётный номер PR
      - name: Setting reviewer for 6313 - odd PR
        if: env.GROUP == '6313' && github.event.pull_request.number % 2 == 1
        uses: AveryCameronUofR/add-reviewer-gh-action@1.0.3
        with:
          reviewers: "IlyaOv"
          token: ${{ secrets.GITHUB_TOKEN }}

      # Группа 6313 + чётный номер PR
      - name: Setting reviewer for 6313 - even PR
        if: env.GROUP == '6313' && github.event.pull_request.number % 2 == 0
        uses: AveryCameronUofR/add-reviewer-gh-action@1.0.3
        with:
          reviewers: "mxwrlld"
          token: ${{ secrets.GITHUB_TOKEN }}
