name: lab_1 checks

on:
  pull_request:
    paths:
      - "lab_1/**"
      - ".github/workflows/CI.yml"
  push:
    paths:
      - "lab_1/**"
      - ".github/workflows/CI.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab_1/requirements*.txt

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Type check
        run: make typecheck

      - name: Tests
        run: make test
