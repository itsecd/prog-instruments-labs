name: Python Quality CI

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pyright pytest requests beautifulsoup4 matplotlib

    - name: Run Full Check
      run: make fullcheck