name: Quality Control & CI

on:
  push:
    branches: [ main, lab-1 ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pytest matplotlib numpy

      - name: Run Ruff Linter
        run: |
          cd lab_1
          ruff check .

      - name: Run Ruff Formatter Check
        run: |
          cd lab_1
          ruff format --check .

      - name: Run Pyright Type Check
        run: |
          cd lab_1
          pyright

      - name: Run Pytest
        run: |
          cd lab_1
          pytest