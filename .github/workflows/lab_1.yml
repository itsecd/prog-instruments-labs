name: lab_1 checks

on:
  pull_request:
    paths:
      - "lab_1/**"
      - ".github/workflows/lab_1.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: python -m pip install ruff pyright
      - name: Lint
        run: make lint
      - name: Format check
        run: make format-check
      - name: Type check
        run: make typecheck
      - name: Tests
        run: make test