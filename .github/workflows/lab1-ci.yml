name: Lab 1 CI

on:
  pull_request:
    paths: ["lab_1/**"]
  push:
    branches: [lab1]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab_1/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: make fullcheck
      - run: make test
        env:
          MPLBACKEND: Agg