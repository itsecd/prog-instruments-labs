name: Lab 1 CI

on:
  pull_request:
    paths:
      - "lab_1/**"
  push:
    branches:
      - lab1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pre-commit
          # Если в task_1 есть специфичные зависимости, раскомментируй строку ниже:
          # pip install -r lab_1/task_1/requirements.txt

      - name: Run full check
        run: |
          cd lab_1
          make fullcheck
