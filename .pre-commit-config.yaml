repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [ --fix ]
        files: ^lab_1/
      - id: ruff-format
        files: ^lab_1/

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.355
    hooks:
      - id: pyright
        files: ^lab_1/
        stages: [pre-push]