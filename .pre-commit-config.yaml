repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types: [python]
        files: ^lab_1/

      - id: ruff-lint
        name: ruff check
        entry: python -m ruff check --fix
        language: system
        types: [python]
        files: ^lab_1/

      - id: pyright
        name: pyright
        entry: python -m pyright
        language: system
        types: [python]
        files: ^lab_1/
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: python -m pytest lab_1
        language: system
        types: [python]
        files: ^lab_1/
        stages: [pre-push]
        pass_filenames: false