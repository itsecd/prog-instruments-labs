minimum_pre_commit_version: "4.6.2"

repos:
  - repo: local
    hooks:
      - id: lab1-static-checks
        name: Lab 1 static checks
        entry: make -C lab_1 fullcheck
        language: unsupported
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-commit]

      - id: lab1-full-tests
        name: Lab 1 full checks and tests
        entry: make -C lab_1 fulltest
        language: unsupported
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]