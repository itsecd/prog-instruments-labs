repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^lab_1/
      - id: ruff-format
        files: ^lab_1/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        files: ^lab_1/
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
        files: ^lab_1/
      - id: check-merge-conflict
        files: ^lab_1/
      - id: trailing-whitespace
        files: ^lab_1/
      - id: end-of-file-fixer
        files: ^lab_1/